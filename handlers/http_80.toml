# HTTP honeypot on port 80

[service]
port = 80
type = "http"

[response_headers]
status_line = "HTTP/1.1 200 OK"
headers = [
    "Server: Honeyknot0.3",
    "Accept-Ranges: bytes",
    "Content-Type: text/html",
    "Connection: close",
]

[default_response]
body = "<html><body><h1>404 Not Found</h1></body></html>"

[[rules]]
name = "head_request"
pattern = '^HEAD '
response = ""

[[rules]]
name = "php_request"
pattern = '^GET /.*\.php'
response = '<?php system($_REQUEST["cmd"]); ?>'

[[rules]]
name = "root_get"
pattern = '^GET / '
response = "<html><body><h2>success</h2></body></html>"

[[rules]]
name = "post_request"
pattern = '^POST '
response = """\
<html><body>\
<h2>mysql_1.2.4 error</h2><br>\
<h4>stacktrace</h4><br>\
<p>1_0x0000013c#sysc(c_INSERT|c_SELECT|c_DELETE...)<br>\
2_0x0000013d#admin..p...2121admin!2121...<br>\
3_0x0000013e#segfault(sysc(callback_go))<br>\
...</p></body></html>"""
